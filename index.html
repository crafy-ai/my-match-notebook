<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Match Notebook</title>
    <link rel="stylesheet" href="styles.css?v=20260608-wc-standings5" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Eastern Time · Personal watchlist</p>
        <h1>My Match Notebook</h1>
      </div>
      <div class="source-note" id="generatedAt"></div>
    </header>

    <main>
      <section class="overview" aria-label="Schedule overview">
        <article>
          <span id="totalCount">0</span>
          <p>Total matches</p>
        </article>
        <article>
          <span id="nextCount">0</span>
          <p>Upcoming</p>
        </article>
        <article>
          <span id="lateCount">0</span>
          <p>Late night</p>
        </article>
        <article>
          <span id="favoriteCount">0</span>
          <p>Favorites</p>
        </article>
      </section>

      <section class="controls" aria-label="Filter schedule">
        <div class="tabs" role="tablist" aria-label="Tournaments">
          <button class="tab active" data-filter="all" type="button">All</button>
          <button class="tab" data-filter="worldcup" type="button">World Cup</button>
          <button class="tab" data-filter="cs2" type="button">CS2 Cologne</button>
        </div>
        <label class="search">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Team, stage, city, venue" />
        </label>
        <label class="toggle">
          <input id="futureOnly" type="checkbox" />
          <span>Future only</span>
        </label>
        <label class="toggle">
          <input id="lateOnly" type="checkbox" />
          <span>Late night</span>
        </label>
        <label class="toggle">
          <input id="normalTimeOnly" type="checkbox" />
          <span>Normal hours</span>
        </label>
        <label class="toggle">
          <input id="favoritesOnly" type="checkbox" />
          <span>Favorites</span>
        </label>
      </section>

      <section class="insights" id="tournamentInsights" aria-label="Bracket and standings"></section>

      <section class="timeline" id="timeline" aria-live="polite"></section>
    </main>

    <footer>
      <div id="sources"></div>
    </footer>

    <script src="data.js?v=20260615-latest1"></script>
    <script src="updates.js?v=20260615-latest1"></script>
    <script src="news.js?v=20260615-latest1"></script>
    <script src="app.js?v=20260615-latest1"></script>
  </body>
</html>
